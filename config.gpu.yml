# `max_batch_size` = requests admitted for a model in one engine step *and*
# processed together (see docs/batching.md). Phase 8-6 set the newly batched
# model types to an initial 8; per-step tuning lands with the benchmark-host run
# (docs/benchmarks/throughput.md, Phase 8 section).
# `num_workers` (FasterWhisper only) = CTranslate2 inter_threads: concurrent
# transcribes on the shared weights. Phase 10-1 initial values, pending the
# Phase 10-5 benchmark: turbo 2 / tiny 4; unset means 1 (today's behaviour).
# `ar_inference` = the shared autoregressive KV-cache pool (Phase 9-2). The
# Chatterbox English/Turbo entries are `ar_decode`-class as of Phase 9-6 with an
# initial admission width of 4, justified from this budget: 4 English requests
# (2 CFG rows each = 8 slabs × 90 MiB) + 4 Turbo requests (4 slabs × 72 MiB) =
# 1008 MiB ≤ 1 GiB at the default 768-token slot. Pending the benchmark-host
# `batching:1-vs-N` gate; set `batched_inference: false` (or width 1) to force
# the proven sequential loop.
ar_inference:
  kv_cache_budget_bytes: 1073741824   # 1 GiB, owner-approved initial value (2026-11-07)
  default_cap_tokens: 768             # ≈30 s per sequence at 25 Hz
  enabled: true

model_configs:
  - name: "hs1-encoder"
    model: "harmony-ai/harmony-speech-v1"
    model_type: "HarmonySpeechEncoder"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cpu"

  - name: "hs1-synthesizer"
    model: "harmony-ai/harmony-speech-v1"
    model_type: "HarmonySpeechSynthesizer"
    max_batch_size: 1
    dtype: "float32"
    device_config:
      device: "cpu"

  - name: "hs1-vocoder"
    model: "harmony-ai/harmony-speech-v1"
    model_type: "HarmonySpeechVocoder"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cpu"

  - name: "ov1-synthesizer-en"
    model: "myshell-ai/openvoice"
    model_type: "OpenVoiceV1Synthesizer"
    language: "EN"
    voices: ["default", "whispering", "shouting", "excited", "cheerful", "terrified", "angry", "sad", "friendly"]
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov1-synthesizer-zh"
    model: "myshell-ai/openvoice"
    model_type: "OpenVoiceV1Synthesizer"
    language: "ZH"
    voices: ["default"]
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov1-tone-converter"
    model: "myshell-ai/openvoice"
    model_type: "OpenVoiceV1ToneConverter"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov1-tone-converter-encoder"
    model: "myshell-ai/openvoice"
    model_type: "OpenVoiceV1ToneConverterEncoder"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov2-synthesizer-en"
    model: "myshell-ai/MeloTTS-English-v3"
    model_type: "MeloTTSSynthesizer"
    language: "EN"
    voices: [ "EN-Newest" ]
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov2-synthesizer-zh"
    model: "myshell-ai/MeloTTS-Chinese"
    model_type: "MeloTTSSynthesizer"
    language: "ZH"
    voices: [ "ZH" ]
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov2-synthesizer-es"
    model: "myshell-ai/MeloTTS-Spanish"
    model_type: "MeloTTSSynthesizer"
    language: "ES"
    voices: [ "ES" ]
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov2-synthesizer-fr"
    model: "myshell-ai/MeloTTS-French"
    model_type: "MeloTTSSynthesizer"
    language: "FR"
    voices: [ "FR" ]
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov2-synthesizer-ja"
    model: "myshell-ai/MeloTTS-Japanese"
    model_type: "MeloTTSSynthesizer"
    language: "JA"
    voices: [ "JP" ]
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov2-tone-converter"
    model: "myshell-ai/openvoicev2"
    model_type: "OpenVoiceV2ToneConverter"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "ov2-tone-converter-encoder"
    model: "myshell-ai/openvoicev2"
    model_type: "OpenVoiceV2ToneConverterEncoder"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "faster-whisper-large-v3-turbo"
    model: "large-v3-turbo"
    model_type: "FasterWhisper"
    max_batch_size: 16
    num_workers: 2
    # Phase 11-0 (owner decision 2026-11-08): the B=1 real-model parity gate
    # passed on text/segments/timings (language_probability moves 0.2-0.8 pp),
    # so the cross-request window batcher is shipped ON.
    batched_inference: true
    whisper_window_batch_size: 8
    dtype: "float32"
    device_config:
      device: "cuda"

  - name: "faster-whisper-tiny"
    model: "tiny"
    model_type: "FasterWhisper"
    max_batch_size: 16
    num_workers: 4
    batched_inference: true
    whisper_window_batch_size: 8
    dtype: "float32"
    device_config:
      device: "cuda"

  # Silero VAD - SOTA voice activity detection model
  - name: "silero-vad"
    model: "silero-vad"
    model_type: "SileroVAD"
    load_format: "onnx"  # Use ONNX version for better performance
    max_batch_size: 16
    dtype: "float32"
    device_config:
      device: "cpu"  # Silero VAD is CPU-only

  # VoiceFixer Restorer - for audio denoising and enhancement
  - name: "voicefixer-restorer"
    model: "jlmarrugom/voice_fixer"  # Alternative: "cqchangm/voicefixer"
    model_type: "VoiceFixerRestorer"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  # VoiceFixer Vocoder - for mel-spectrogram to audio conversion
  - name: "voicefixer-vocoder"
    model: "jlmarrugom/voice_fixer"  # Alternative: "cqchangm/voicefixer"
    model_type: "VoiceFixerVocoder"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cuda"

  # KittenTTS - Ultra-lightweight ONNX TTS models (English only)
  # Choose one variant based on your quality/size requirements:

  # kitten-tts-mini: Highest quality, 80MB
  - name: "kitten-tts-mini"
    model: "KittenML/kitten-tts-mini-0.8"
    model_type: "KittenTTSSynthesizer"
    voices: ["Bella", "Jasper", "Luna", "Bruno", "Rosie", "Hugo", "Kiki", "Leo"]
    max_batch_size: 4
    dtype: "float32"
    device_config:
      device: "cpu"

  # kitten-tts-micro: Good quality, 41MB
  - name: "kitten-tts-micro"
    model: "KittenML/kitten-tts-micro-0.8"
    model_type: "KittenTTSSynthesizer"
    voices: ["Bella", "Jasper", "Luna", "Bruno", "Rosie", "Hugo", "Kiki", "Leo"]
    max_batch_size: 4
    dtype: "float32"
    device_config:
      device: "cpu"

  # kitten-tts-nano: Lightweight, 56MB fp32
  - name: "kitten-tts-nano"
    model: "KittenML/kitten-tts-nano-0.8-fp32"
    model_type: "KittenTTSSynthesizer"
    voices: ["Bella", "Jasper", "Luna", "Bruno", "Rosie", "Hugo", "Kiki", "Leo"]
    max_batch_size: 4
    dtype: "float32"
    device_config:
      device: "cpu"

  # kitten-tts-nano-int8: Most compact, 25MB (quantized)
  - name: "kitten-tts-nano-int8"
    model: "KittenML/kitten-tts-nano-0.8-int8"
    model_type: "KittenTTSSynthesizer"
    voices: ["Bella", "Jasper", "Luna", "Bruno", "Rosie", "Hugo", "Kiki", "Leo"]
    max_batch_size: 4
    dtype: "float32"
    device_config:
      device: "cpu"

  # ===========================================================================
  # Chatterbox TTS - High-quality voice cloning TTS
  # ===========================================================================

  # Chatterbox TTS (standard) - voice cloning + 8 languages
  - name: "chatterbox"
    model: "resemble-ai/chatterbox"
    model_type: "ChatterboxTTS"
    watermark: true          # Set to false to disable perth audio watermarking
    max_batch_size: 4        # AR admission width (initial, pending the host gate)
    dtype: "float16"         # T3 backbone; S3Gen/VE stay float32 (see docs/models.md)
    backbone_group: "chatterbox-base"  # shares S3Gen/VE with the other Chatterbox roles
    device_config:
      device: "cuda"

  # Chatterbox Turbo TTS - faster synthesis with loudness normalization
  - name: "chatterbox_turbo"
    model: "resemble-ai/chatterbox-turbo"
    model_type: "ChatterboxTurboTTS"
    watermark: true
    max_batch_size: 4        # AR admission width (initial, pending the host gate)
    dtype: "float16"         # T3 backbone; own meanflow S3Gen (ungrouped)
    device_config:
     device: "cuda"

  # Chatterbox Multilingual TTS - 23-language support with voice cloning
  - name: "chatterbox_multilingual"
    model: "resemble-ai/chatterbox"
    model_type: "ChatterboxMultilingualTTS"
    watermark: true
    max_batch_size: 1
    dtype: "float16"
    # Joins the base group on checkpoint-hash evidence (see
    # harmonyspeech/modeling/models/chatterbox/factory.py): s3gen.pt and ve.pt
    # are bit-identical to the base s3gen.safetensors / ve.safetensors.
    backbone_group: "chatterbox-base"
    device_config:
     device: "cuda"

  # Chatterbox Voice Conversion - convert speech from one voice to another
  - name: "chatterbox_vc"
    model: "resemble-ai/chatterbox"
    model_type: "ChatterboxVC"
    watermark: true
    max_batch_size: 1
    dtype: "float16"         # no T3 here; grouped for the shared S3Gen/VE
    backbone_group: "chatterbox-base"
    device_config:
     device: "cuda"

  # Chatterbox Embedding (OPTIONAL) - dedicated executor for /v1/embeddings endpoint
  # If omitted, embedding requests are handled by the ChatterboxTTS executor above.
  - name: "chatterbox_embedding"
    model: "resemble-ai/chatterbox"
    model_type: "ChatterboxEmbedding"
    # Phase 11-0 (dated decision 2026-11-08): admission depth 4. The executor
    # still runs the embed step serially (one `prepare_conditionals` at a time),
    # so this is a *queue depth*, not a batch width — it lets the clone pipeline
    # hand four requests to the TTS AR step in one engine step instead of
    # serialising the flood at embed admission.
    max_batch_size: 4
    dtype: "float16"
    backbone_group: "chatterbox-base"  # shares S3Gen/VE/T3; owns its conds
    device_config:
      device: "cuda"
