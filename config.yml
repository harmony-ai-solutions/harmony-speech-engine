# `max_batch_size` = requests admitted for a model in one engine step *and*
# processed together (see docs/batching.md). Phase 8-6 set the newly batched
# model types to an initial 8; per-step tuning lands with the benchmark-host run
# (docs/benchmarks/throughput.md, Phase 8 section).
# `num_workers` (FasterWhisper only) = CTranslate2 inter_threads: concurrent
# transcribes on the shared weights. Phase 10-1 initial values: turbo 2 / tiny 4;
# unset means 1. Phase 11-0 (owner decision 2026-11-08) flips
# `batched_inference: true` for Whisper in both shipped configs: the real-model
# B=1 parity gate passed on text/segments/timings (only `language_probability`
# moved 0.2-0.8 pp). `whisper_window_batch_size` (default 8) is the memory bound
# on one formed cross-request window batch.
# `ar_inference` = the shared autoregressive KV-cache pool (Phase 9-2). The
# Chatterbox English/Turbo entries are `ar_decode`-class as of Phase 9-6 with an
# initial admission width of 4 (the same arena maths as config.gpu.yml). On this
# CPU config the pool is fp32, so the slabs are twice as large: English clamps to
# 5 slots (2 concurrent requests) and Turbo's arena cannot fit the 1 GiB budget,
# which degrades that model to the sequential loop (never an error). Pending the
# benchmark-host `batching:1-vs-N` gate; set `batched_inference: false` to force
# the proven sequential loop everywhere.
ar_inference:
  kv_cache_budget_bytes: 1073741824   # 1 GiB, owner-approved initial value (2026-11-07)
  default_cap_tokens: 768             # ≈30 s per sequence at 25 Hz
  enabled: true

model_configs:
  - name: "hs1-encoder"
    model: "harmony-ai/harmony-speech-v1"
    model_type: "HarmonySpeechEncoder"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cpu"

  - name: "hs1-synthesizer"
    model: "harmony-ai/harmony-speech-v1"
    model_type: "HarmonySpeechSynthesizer"
    max_batch_size: 1
    dtype: "float32"
    device_config:
      device: "cpu"

  - name: "hs1-vocoder"
    model: "harmony-ai/harmony-speech-v1"
    model_type: "HarmonySpeechVocoder"
    max_batch_size: 8
    batched_inference: true
    dtype: "float32"
    device_config:
      device: "cpu"

  - name: "ov1-synthesizer-en"
