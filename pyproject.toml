[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "torch>=2.7.1",
    "packaging"
]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-speech-engine"
version = "0.1.1-rc2"
description = "A high performance inference engine for Open Source Speech AI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0"}
authors = [{name = "Harmony.AI Solutions"}]
keywords = ["AI", "Speech", "TTS", "STT", "Voice", "Inference", "PyTorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://project-harmony.ai/"
Documentation = "https://github.com/harmony-ai-solutions/harmony-speech-engine/docs"
GitHub = "https://github.com/harmony-ai-solutions/harmony-speech-engine"
Huggingface = "https://huggingface.co/harmony-ai"

[project.scripts]
harmonyspeech = "harmonyspeech.endpoints.cli:main"

[tool.setuptools]
packages = {find = {exclude = ["kernels", "examples", "tests*"]}}

[tool.setuptools.package-data]
harmonyspeech = [
    "endpoints/kobold/klite.embd",
    "quantization/hadamard.safetensors",
    "py.typed",
    "modeling/layers/fused_moe/configs/*.json",
    "assets/voices/*.wav",
    "assets/voices/LICENSE",
    "assets/voices/PROVENANCE.md"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "-ra",
    # Coverage is disabled by default for speed (collection + run takes 4+ minutes).
    # To run with coverage: pytest --cov=harmonyspeech --cov-report=term-missing --cov-report=xml
]
filterwarnings = [
    # resemble-perth 1.0.1 imports pkg_resources (deprecated API) at import
    # time; no fixed release exists (2026-11-15). The production import sites
    # (modeling/loader.py, chatterbox.py) suppress it already — this covers
    # direct perth imports in tests.
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
markers = [
    "unit: marks tests as unit tests (fast, fully mocked)",
    "integration: marks tests as integration tests (component interaction, partially mocked)",
    "e2e: marks tests as end-to-end tests (real models, slow, CPU-only)",
    "slow: marks tests that take > 30 seconds to run",
]

[tool.coverage.run]
omit = [
    "harmonyspeech/modeling/models/*",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Vendored upstream model code (MeloTTS, OpenVoice, VoiceFixer, the HS1
# PyTorch model tree). Reformatted/re-linted copies of these trees would make
# future upstream imports needlessly painful, and they carry ~230 violations
# of the project ruleset (dead branches, ambiguous names) that are harmless
# in code we do not own. First-party adapted trees (chatterbox, kittentts)
# stay linted.
extend-exclude = [
    "harmonyspeech/modeling/models/melo",
    "harmonyspeech/modeling/models/openvoice",
    "harmonyspeech/modeling/models/voicefixer",
    "harmonyspeech/modeling/models/harmonyspeech",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Required with format.skip-magic-trailing-comma = true (ruff warns about the
# incompatible combination otherwise); matches the standalone isort setting below.
split-on-trailing-comma = false

[tool.isort]
split-on-trailing-comma = false

[tool.ruff.format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
